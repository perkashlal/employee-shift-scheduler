name: CI
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Setup Docker Bridge
        run: |
          sudo chmod 666 /var/run/docker.sock
          sudo socat TCP-LISTEN:2375,fork,reuseaddr UNIX-CONNECT:/var/run/docker.sock &
          timeout 30s sh -c 'until nc -z localhost 2375; do sleep 1; done'

      - name: Build and Test
        env:
          DOCKER_HOST: tcp://127.0.0.1:2375
          DOCKER_API_VERSION: "1.44"
          TESTCONTAINERS_CHECKS_DISABLE: "true"
        run: xvfb-run --server-args="-screen 0 1280x1024x24" mvn -B verify -Pjacoco
