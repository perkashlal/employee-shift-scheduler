name: CI
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Docker / Testcontainers diagnostics
        shell: bash
        run: |
          set -euxo pipefail
          docker version
          docker info
          ls -la /var/run/docker.sock
          id
          groups
          # ensure socket readable (usually already is)
          sudo chmod 666 /var/run/docker.sock || true
          # remove any overrides that can break Testcontainers
          unset DOCKER_HOST DOCKER_TLS_VERIFY DOCKER_CERT_PATH DOCKER_API_VERSION
          docker context use default || true

      - name: Build and Test with Maven
        env:
          # Ensure Testcontainers uses the standard socket on Linux runners
          DOCKER_HOST: unix:///var/run/docker.sock
          TESTCONTAINERS_RYUK_DISABLED: "false"
        run: xvfb-run -a mvn -B -ntp verify -Pjacoco

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: warn
