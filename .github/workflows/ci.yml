name: Java CI with Maven and SonarCloud in Linux

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      docker:
        image: docker:26-dind
        options: --privileged
        ports:
          - 2375:2375

    env:
      DOCKER_HOST: tcp://localhost:2375
      DOCKER_TLS_CERTDIR: ""
      TESTCONTAINERS_RYUK_DISABLED: "true"
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Cache Maven + Sonar
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2
            ~/.sonar/cache
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml', '**/*.yml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Wait for Docker
        run: |
          for i in {1..30}; do
            docker version && break
            sleep 2
          done
          docker info

      - name: Set Maven Additional Goals
        if: ${{ env.SONAR_TOKEN }}
        run: echo "SONARGOAL=sonar:sonar" >> $GITHUB_ENV

      - name: Build with Maven and SonarCloud
        run: >
          xvfb-run -a mvn -B -ntp verify -Pjacoco $SONARGOAL
          -Dsonar.organization=perkashlal
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.projectKey=perkashlal_employee-shift
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
