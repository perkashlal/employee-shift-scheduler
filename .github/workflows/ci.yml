name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Verify Docker (required by Testcontainers)
        run: docker info

      - name: Build + tests + JaCoCo
        run: xvfb-run -a mvn -B -ntp verify -Pjacoco

      # SonarCloud should NOT run on PRs from forks (secrets not available)
      - name: SonarCloud analysis
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && env.SONAR_TOKEN != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          xvfb-run -a mvn -B -ntp sonar:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=perkashlal
          -Dsonar.projectKey=perkashlal_employee-shift-scheduler
