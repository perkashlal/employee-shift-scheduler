name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORG: perkashlal
      SONAR_PROJECT_KEY: perkashlal_employee-shift-scheduler

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Verify Docker
        run: docker version && docker info

      - name: Enable Sonar goal when token exists
        if: ${{ env.SONAR_TOKEN != '' }}
        run: echo "SONARGOAL=sonar:sonar" >> $GITHUB_ENV

      - name: Build, test, coverage, (optional) Sonar
        env:
          # Forces Testcontainers to find the Docker daemon
          DOCKER_HOST: unix:///var/run/docker.sock
          # CRITICAL FIX: Upgrades the communication protocol to match the runner
          DOCKER_API_VERSION: "1.44"
        run: >
          xvfb-run -a mvn -B -ntp verify -Pjacoco ${{ env.SONARGOAL }}
          -Dsonar.organization=${{ env.SONAR_ORG }}
          -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
          -Dsonar.host.url=https://sonarcloud.io
