name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install Xvfb + lightweight WM (stable Swing tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox

      # Unit tests + unit JaCoCo XML (skip IT/E2E)
      - name: Run unit tests with JaCoCo (skip IT/E2E)
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=false"
        run: |
          set -euxo pipefail
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x1024x24 -ac +extension RANDR &
          openbox-session >/dev/null 2>&1 &
          sleep 2
          mvn -B -ntp clean verify -Pjacoco -DskipITs

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            **/target/surefire-reports/**
          if-no-files-found: warn

      - name: Upload unit JaCoCo XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-unit-xml
          path: target/site/jacoco/jacoco.xml
          if-no-files-found: error

  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Docker info
        run: |
          docker version
          docker info
          ls -la /var/run/docker.sock

      # Integration/E2E (Failsafe) + IT JaCoCo XML
      - name: Run integration + e2e tests with JaCoCo (Failsafe only)
        shell: bash
        run: |
          set -euxo pipefail
          unset DOCKER_HOST DOCKER_TLS_VERIFY DOCKER_CERT_PATH DOCKER_API_VERSION
          export DOCKER_HOST=unix:///var/run/docker.sock
          xvfb-run -a mvn -B -ntp clean verify -Pjacoco -DskipTests -DskipITs=false

      - name: Debug: list coverage files
        if: always()
        run: |
          ls -la target || true
          ls -la target/site || true
          ls -la target/site/jacoco || true
          ls -la target/site/jacoco-it || true
          find target -maxdepth 3 -type f -name "jacoco*.xml" -print || true

      - name: Upload failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports
          path: |
            **/target/failsafe-reports/**
          if-no-files-found: ignore

      - name: Upload IT JaCoCo XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-it-xml
          path: target/site/jacoco-it/jacoco.xml
          if-no-files-found: error

  sonar:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [unit-tests, integration-tests]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Download unit JaCoCo XML
        uses: actions/download-artifact@v4
        with:
          name: jacoco-unit-xml
          path: target/site/jacoco

      - name: Download IT JaCoCo XML
        uses: actions/download-artifact@v4
        with:
          name: jacoco-it-xml
          path: target/site/jacoco-it

      - name: Verify coverage files exist
        run: |
          ls -la target/site/jacoco || true
          ls -la target/site/jacoco-it || true

      - name: SonarCloud Scan (imports unit + IT coverage)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B -ntp sonar:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=perkashlal
          -Dsonar.projectKey=perkashlal_employee-shift-scheduler
          -Dsonar.token=${SONAR_TOKEN}
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml,target/site/jacoco-it/jacoco.xml
