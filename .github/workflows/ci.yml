name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run unit tests (Surefire)
        run: xvfb-run -a mvn -B -ntp clean test

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            **/target/surefire-reports/**
          if-no-files-found: warn

  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Docker info
        run: |
          docker version
          docker info

      # Runs Failsafe only (integration/e2e), skips Surefire unit tests
      - name: Run integration + e2e tests (Failsafe)
        shell: bash
        run: |
          set -euxo pipefail
          unset DOCKER_HOST DOCKER_TLS_VERIFY DOCKER_CERT_PATH DOCKER_API_VERSION
          export DOCKER_HOST=unix:///var/run/docker.sock
          xvfb-run -a mvn -B -ntp verify -DskipTests -DskipITs=false

      - name: Upload failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports
          path: |
            **/target/failsafe-reports/**
          if-no-files-found: ignore

  sonar:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # required for SonarCloud blame/branch analysis

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Docker info
        run: |
          docker version
          docker info

      # IMPORTANT:
      # This runs unit + integration tests WITH JaCoCo enabled, so SonarCloud can import BOTH:
      # - target/site/jacoco/jacoco.xml
      # - target/site/jacoco-it/jacoco.xml
      - name: Verify (unit + IT) with JaCoCo
        shell: bash
        run: |
          set -euxo pipefail
          unset DOCKER_HOST DOCKER_TLS_VERIFY DOCKER_CERT_PATH DOCKER_API_VERSION
          export DOCKER_HOST=unix:///var/run/docker.sock
          xvfb-run -a mvn -B -ntp clean verify -Pjacoco

      - name: Debug JaCoCo XML presence
        if: always()
        run: |
          ls -la target/site || true
          ls -la target/site/jacoco || true
          ls -la target/site/jacoco-it || true

      - name: SonarCloud Scan (imports unit + IT coverage)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B -ntp sonar:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=perkashlal
          -Dsonar.projectKey=perkashlal_employee-shift-scheduler
          -Dsonar.token=${SONAR_TOKEN}
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml,target/site/jacoco-it/jacoco.xml

      - name: Upload JaCoCo reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: |
            **/target/site/jacoco/**
            **/target/site/jacoco-it/**
          if-no-files-found: ignore
