name: CI

on:
push:
branches: [ "main", "master" ]
pull_request:

jobs:
build:
runs-on: ubuntu-latest

```
permissions:
  contents: read

env:
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

steps:
  - name: Checkout
    uses: actions/checkout@v4
    with:
      fetch-depth: 0

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: 17
      cache: maven

  # GUI tests (Swing)
  - name: Install Xvfb
    run: sudo apt-get update && sudo apt-get install -y xvfb

  # IMPORTANT: verify docker is available for Testcontainers
  - name: Verify Docker
    run: docker info

  # Run tests + coverage + sonar
  - name: Build and analyze
    run: |
      xvfb-run -a mvn -B -ntp verify -Pjacoco sonar:sonar \
      -Dsonar.organization=perkashlal \
      -Dsonar.projectKey=perkashlal_employee-shift-scheduler \
      -Dsonar.host.url=https://sonarcloud.io
```
