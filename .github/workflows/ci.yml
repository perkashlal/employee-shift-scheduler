  coverage:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install Xvfb + lightweight WM
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox

      - name: Run unit tests with JaCoCo (skip IT/E2E)
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=false"
        run: |
          set -euxo pipefail
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x1024x24 -ac +extension RANDR &
          openbox-session >/dev/null 2>&1 &
          # wait a moment for X to be ready
          sleep 2
          mvn -B -ntp clean verify -Pjacoco -DskipITs

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: |
            **/target/site/jacoco/**
            **/target/site/jacoco-it/**
            **/target/site/jacoco/jacoco.xml
            **/target/site/jacoco-it/jacoco.xml
          if-no-files-found: warn
