name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORG: perkashlal
      SONAR_PROJECT_KEY: perkashlal_employee-shift-scheduler

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install Xvfb and Socat
        run: sudo apt-get update && sudo apt-get install -y xvfb socat

      - name: Start Docker TCP Bridge
        run: |
          sudo chmod 666 /var/run/docker.sock
          sudo socat TCP-LISTEN:2375,fork,reuseaddr UNIX-CONNECT:/var/run/docker.sock &
          sleep 5

      - name: Enable Sonar goal when token exists
        if: ${{ env.SONAR_TOKEN != '' }}
        run: echo "SONARGOAL=sonar:sonar" >> $GITHUB_ENV

      - name: Build and Test
        env:
          DOCKER_HOST: tcp://127.0.0.1:2375
          DOCKER_API_VERSION: "1.44"
          TESTCONTAINERS_CHECKS_DISABLE: "true"
          # Ensures AWT/Swing works in headless mode
          JAVA_AWT_HEADLESS: "false" 
        run: >
          xvfb-run --server-args="-screen 0 1024x768x24" 
          mvn -B -ntp verify -Pjacoco ${{ env.SONARGOAL }}
          -Dsonar.organization=${{ env.SONAR_ORG }}
          -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
          -Dsonar.host.url=https://sonarcloud.io
