name: CI + SonarCloud

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Docker diagnostics (runner)
        run: |
          set -eux
          echo "DOCKER_HOST=$DOCKER_HOST"
          echo "DOCKER_API_VERSION=$DOCKER_API_VERSION"
          docker version
          docker version --format 'Client API={{.Client.APIVersion}} Server API={{.Server.APIVersion}}'
          docker info
          ls -l /var/run/docker.sock
          docker ps

      - name: Verify (unit + IT + E2E) with JaCoCo
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=false"

          # Force Testcontainers to use the Linux Docker daemon
          DOCKER_HOST: unix:///var/run/docker.sock
          TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock

          #  FINAL FIX: prevent Docker Desktop strategy & force Unix socket
          TESTCONTAINERS_DOCKER_CLIENT_STRATEGY: org.testcontainers.dockerclient.UnixSocketClientProviderStrategy

        run: |
          xvfb-run -a mvn -B -ntp clean verify -Pjacoco

      - name: SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn -B -ntp sonar:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=perkashlal \
            -Dsonar.projectKey=perkashlal_employee-shift-scheduler \
            -Dsonar.token=${SONAR_TOKEN} \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
